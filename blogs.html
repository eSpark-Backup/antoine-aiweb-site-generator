<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - Weebseat </title>
    <link rel="stylesheet" href="../style.css" />
</head>
<body>
    <main class="blogsMainContainer">
        <div class="blogSubContainer">
            <div class="blogsVariousDetail">
                <p class="blogsPromo">OUR LATEST NEWS AND BLOG.</p>
                <h1 class="blogsTitle">Stay update with our latest post</h1>
                <div class="blogsMarketingImageContainer">
                    <div class="blogsReviewCard">
                        <p class="cardTitle">Technology</p>
                        <h3>The Impact of Technology on the Workplace: How Technology is Changing</h3>
                        <div class="userDetail">
                            <img src="./assets/blogs-page/blogs/avatar.jpg" width="20px" height="20px" alt="avatar">
                            <p>jason fransisco</p>
                            <p>August 20 2022</p>
                        </div>
                    </div>
                </div>
                <div class="blogsAdSectiion">
                    <p>Advertisment</p>
                    <h6>You can place ads</h6>
                    <p>750x100</p>
                </div>
            </div>
            <div class="blogsCards">
                <h3>Latest Post</h3>
                <div class="cardList" id="cardDataList">
                    <!--data render through map  -->
                </div>
                <div class="seemore">
                    <p>see more</p>
                </div>
                 <div class="blogsAdSectiion" id="lastAdSection">
                <p>Advertisment</p>
                <h6>You can place ads</h6>
                <p>750x100</p>
            </div>

        </div>
    </main>

    <script src="./app.js"></script>
</body>
</html>
