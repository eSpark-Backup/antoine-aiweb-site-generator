<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weebseat - Ultimate AI Website</title>
  <link rel="stylesheet" href="./dashboardPayment.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
<section class="dashboard">
  <div class="sidebar">Sidebar</div>
  <div class="layout-container">
    <div class="header">
      <div class="search-bar">
        <img src="./assets/dashboard/search.png" alt="google" />
        <input placeholder="Search" />
      </div>
      <div class="header-content">
        <div class="notification-icon">
          <img src="./assets/dashboard/notification.png" alt="bell" />
          <p class="noti-count">6</p>
        </div>
        <div class="language">
          <img
            class="flag-icon"
            src="./assets/dashboard/flag.png"
            alt="flag"
          />
          <div>
            <p>English</p>
            <img src="./assets/dashboard/down-arrow.png" alt="arrow" />
          </div>
        </div>
        <div class="profile">
          <img
            class="profile-icon"
            src="./assets/dashboard/profile.png"
            alt="profile"
          />
          <div>
            <p class="profile-name">Moni Roy</p>
            <p class="profile-desc">Website name</p>
          </div>
          <img
            class="arrow-icon"
            src="./assets/dashboard/down-arrow.png"
            alt="arrow"
          />
        </div>
      </div>
    </div>
    <div class="layout">
        <div class="dashboardPaymentSecTitle">
        <h1>Payment Method</h1>
        <p>12 June</p>
    </div>
    <div class="step7">
      <div class="payment-box">
        <h1>Payment Option</h1>
        <div class="payment-options">
          <div class="payment-option-box">
            <img src="./assets/landing-page/steps/vemo.svg" alt="" />
            <label for="vemo">Vemo</label>
            <input type="radio" name="payment" id="vemo" />
          </div>
          <img class="lineImg" src="./assets/landing-page/steps/Line.png" alt="" style="height: 90px; width: 1px" />
          <div class="payment-option-box">
            <img src="./assets/landing-page/steps/paypal.svg" alt="" />
            <label for="paypal">Paypal</label>
            <input type="radio" name="payment" id="paypal" />
          </div>
          <img class="lineImg" src="./assets/landing-page/steps/Line.png" alt="" style="height: 90px; width: 1px" />
          <div class="payment-option-box">
            <img src="./assets/landing-page/steps/amazonpay.svg" alt="" />
            <label for="amazonpay">Amazon Pay</label>
            <input type="radio" name="payment" id="amazonpay" />
          </div>
          <img class="lineImg" src="./assets/landing-page/steps/Line.png" alt="" style="height: 90px; width: 1px" />
          <div class="payment-option-box">
            <img src="./assets/landing-page/steps/CreditCard.svg" alt="" />
            <label for="card">Debid/Credit Card</label>
            <input type="radio" name="payment" id="card" checked />
          </div>
        </div>
        <div class="input-box">
          <label for="">Name on Card</label>
          <input type="text" />
        </div>
        <div class="input-box">
          <label for="">Card Number</label>
          <input type="text" />
        </div>
        <div class="horizontal-input-box">
          <div class="input-box">
            <label for="">Expire Date</label>
            <input type="text" placeholder="DD/YY" />
          </div>
          <div class="input-box">
            <label for="">CVC</label>
            <input type="text" />
          </div>
        </div>
      </div>
      <div class="text-parent">
        <h2>Additional Information</h2>
        <h2>Order Notes <span>(Optional)</span></h2>
      </div>
      <textarea name="" id="" placeholder="Notes about your package. "></textarea>
    </div>
    </div>
  </div>
</section>
</body>

</html>
